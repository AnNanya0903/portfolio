<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h5 mb-3">This link is password protected</h1>
        <p class="text-muted small">Enter the password provided by the enquiry owner to view the shared PDF.</p>
        {% if error %}
          <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ form_action|default:request.get_full_path }}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="sharePasswordInput">Password</label>
            <div class="input-group">
              <input type="password" name="share_password" id="sharePasswordInput" class="form-control" required autofocus autocomplete="new-password" value="">
              <button class="btn btn-outline-secondary" type="button" data-toggle-password="sharePasswordInput">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <button class="btn btn-primary w-100" type="submit">Unlock link</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
  document.addEventListener('click', function (event) {
    const toggleBtn = event.target.closest('[data-toggle-password]');
    if (!toggleBtn) return;
    const targetId = toggleBtn.getAttribute('data-toggle-password');
    const input = document.getElementById(targetId);
    if (!input) return;
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    toggleBtn.innerHTML = showing ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
  });
</script>
